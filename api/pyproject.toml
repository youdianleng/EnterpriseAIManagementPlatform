[project]
name = "eam-api"
version = "0.1.0"
description = "Enterprise AI Management Platform - backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    # Document parsing (ticket 31). One library per format, and each is a real
    # parser rather than a hand-rolled reader: a PDF's text is behind a compressed
    # object graph, and "extract nothing" has to mean "the file holds no text",
    # which only a parser that understands the format can say.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # Multipart uploads. FastAPI needs it to accept `UploadFile` at all, and its
    # absence is a startup error rather than a silent one.
    "python-multipart>=0.0.20",
    # Token counting (ticket 32). The chunk sizes are "about 400 tokens", and a token
    # is what `text-embedding-3-small` charges for — so this is the model's own
    # tokenizer rather than a character estimate. It runs offline: the merge table is
    # vendored at `app/domain/document/data/`, which is why this needs no network at
    # first use and why `tests/test_chunking.py` asserts that file's digest.
    "tiktoken>=0.8",
    # The agent skeleton (ticket 38). `langgraph` is the graph itself; the
    # `-checkpoint-postgres` adapter is the part DESIGN §10.2 actually decides —
    # an interrupted confirmation has to survive a restart, so the state goes in
    # Postgres beside the business tables and **not** in Redis, which §10.2 keeps
    # for things that may be lost. Pinned exactly rather than floored: the
    # checkpointer writes its own tables through its own migration list, and a
    # minor bump is a schema change we would want to review rather than absorb.
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    # The provider adapter for LangChain-shaped models. Nothing imports it yet:
    # ticket 42 owns DESIGN §5.3's degradation chain, and until it lands the
    # graph's one model call goes through ticket 34's `ChatModel` seam
    # (`app/domain/answer/chat.py`) rather than a second provider abstraction.
    # Present because the agent's dependencies are installed as one set — the
    # image runs `uv sync` from this file, so a dependency added later means
    # another rebuild of the running container.
    "langchain-openai==1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `Depends(...)` in argument defaults, which is FastAPI's documented
# dependency-injection form rather than the mutable-default bug the rule targets.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `api/alembic/` is this project's migration directory, but `alembic` is also a
# third-party package. Without this, the local directory wins and ruff demands
# that `from alembic import ...` be grouped with first-party imports.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# Fixtures and tests must share one event loop per test. With a session-scoped
# fixture loop, a connection pool built in that loop is then used from a
# function-scoped test loop, which fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
