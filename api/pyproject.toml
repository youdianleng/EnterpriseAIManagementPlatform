[project]
name = "eam-api"
version = "0.1.0"
description = "Enterprise AI Management Platform - backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `Depends(...)` in argument defaults, which is FastAPI's documented
# dependency-injection form rather than the mutable-default bug the rule targets.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `api/alembic/` is this project's migration directory, but `alembic` is also a
# third-party package. Without this, the local directory wins and ruff demands
# that `from alembic import ...` be grouped with first-party imports.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# Fixtures and tests must share one event loop per test. With a session-scoped
# fixture loop, a connection pool built in that loop is then used from a
# function-scoped test loop, which fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
