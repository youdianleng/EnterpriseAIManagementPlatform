name: enterprise-ai-platform

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eam_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eam}
      # Deterministic collation keeps ORDER BY stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory, so the mount
      # point is the parent directory, not /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eam} -d ${POSTGRES_DB:-eam}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Catches every message the API sends. Development and demo have no way out to
  # the internet on purpose: a digest that escapes the network is a real person's
  # inbox, and nobody testing this system wants to be the one who did that.
  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      # SMTP on 1025 and the web UI on 8025 are its defaults; they are written out
      # because a reader should not have to look them up to know what is exposed.
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Host names come from the compose network, not from .env.
      # DATABASE_URL owns the schema (migrations); APP_DATABASE_URL serves
      # requests, as a role that cannot rewrite the audit trail. Keeping both
      # here rather than deriving one from the other is the point: the two are
      # different credentials, and only one of them belongs in a request.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eam}:${POSTGRES_PASSWORD:-eam_dev_password}@postgres:5432/${POSTGRES_DB:-eam}
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-eam_app}:${APP_DB_PASSWORD:-eam_app_dev_password}@postgres:5432/${POSTGRES_DB:-eam}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-eam_app_dev_password}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Mail goes to the sibling catch-all, and nowhere else. `SMTP_USER` and
      # `SMTP_PASSWORD` are deliberately unset: Mailpit accepts anything, and a
      # credential in a development default is a credential somebody ships.
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@empresa.es}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Host-facing, because the link in a digest is opened in the reader's browser.
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      DIGEST_DEFAULT_LANGUAGE: ${DIGEST_DEFAULT_LANGUAGE:-es}
      DIGEST_MAX_ATTEMPTS: ${DIGEST_MAX_ATTEMPTS:-3}
      # Where an uploaded original is kept (ticket 31). Content-addressed under this
      # root, so the same bytes are one file wherever they were uploaded from; the
      # mount below is what keeps them across a container rebuild, which is the whole
      # point of keeping the original at all.
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/data/documents}
      # The parsing pipeline's in-process runner, **on in development only**. A
      # development stack has no cron and no worker, so without it an upload sits in
      # `processing` for ever and the screen honestly says so — which reads as a broken
      # pipeline rather than as an unconfigured one. Production runs the command from a
      # scheduler, and this stays off there.
      DOCUMENT_PARSE_RUNNER_ENABLED: ${DOCUMENT_PARSE_RUNNER_ENABLED:-true}
      DOCUMENT_PARSE_INTERVAL_SECONDS: ${DOCUMENT_PARSE_INTERVAL_SECONDS:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      # A named volume rather than a bind mount: these are the company's originals,
      # they are not source code, and a bind mount inside the API's own tree would put
      # hundreds of uploaded files where a `git status` has to look at them.
      - document_storage:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: dev
    environment:
      NODE_ENV: development
      # Browser-facing URL: the browser runs on the host, not inside the network.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-facing URL, used by the Server Components that forward the
      # session cookie. Inside this container "localhost" is the container, so
      # the compose service name is the only address that resolves.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  # The uploaded originals. A volume rather than a bind mount so `down -v` is the one
  # command that removes them and nothing in the source tree has to know they exist.
  document_storage:
  web_node_modules:
  web_next_cache:
