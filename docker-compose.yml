name: enterprise-ai-platform

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eam_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eam}
      # Deterministic collation keeps ORDER BY stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory, so the mount
      # point is the parent directory, not /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eam} -d ${POSTGRES_DB:-eam}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Host names come from the compose network, not from .env.
      # DATABASE_URL owns the schema (migrations); APP_DATABASE_URL serves
      # requests, as a role that cannot rewrite the audit trail. Keeping both
      # here rather than deriving one from the other is the point: the two are
      # different credentials, and only one of them belongs in a request.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eam}:${POSTGRES_PASSWORD:-eam_dev_password}@postgres:5432/${POSTGRES_DB:-eam}
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-eam_app}:${APP_DB_PASSWORD:-eam_app_dev_password}@postgres:5432/${POSTGRES_DB:-eam}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-eam_app_dev_password}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: dev
    environment:
      NODE_ENV: development
      # Browser-facing URL: the browser runs on the host, not inside the network.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
  web_next_cache:
